<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bedroom Planner</title>
<meta name="theme-color" content="#0f1419">
<script>try{if(localStorage.getItem('room-planner-v2-theme')==='light'){document.documentElement.dataset.theme='light'}}catch(e){}</script>
<meta name="description" content="Plan a bedroom layout: drag furniture in a to-scale top view of the room.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Dark is the default on every device; light is an opt-in from the Room panel */
:root{
  --paper:#0f1419; --sheet:#171d24; --ink:#e4e9ee; --ink2:#b4bfca; --muted:#8e9aa6; --line:#29323c;
  --grid:#1a2129; --grid2:#232c36; --floor:#141a21; --wall:#e4e9ee;
  --accent:#7ea2ff; --accent-soft:#1f2b45; --danger:#ff6a60; --warn:#f0a630; --ok:#5cc28a;
  --wood:#5e4c3a; --fabric:#31425a; --fabric2:#3c4f6a; --soft:#463b52; --desk:#3a4535; --stone:#38342e;
  --shadow:0 6px 24px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
  --f-ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --paper:#f2f3f5; --sheet:#ffffff; --ink:#1f2933; --ink2:#4a5562; --muted:#6b7682; --line:#e0e4e9;
  --grid:#eef1f4; --grid2:#e0e5ea; --floor:#fcfcfd; --wall:#1f2933;
  --accent:#2f62d6; --accent-soft:#e4ecfc; --danger:#d23b32; --warn:#c47a00; --ok:#2e7d4f;
  --wood:#e6d8c3; --fabric:#d5e0f0; --fabric2:#eef3fa; --soft:#e8e0f0; --desk:#e0e7d8; --stone:#ece8e1;
  --shadow:0 6px 24px rgba(20,30,45,.14),0 1px 3px rgba(20,30,45,.1); color-scheme:light}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.4 var(--f-ui);display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* floating controls — the plan gets the whole screen */
:root{--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
.status{position:absolute;z-index:6;top:calc(10px + var(--st));left:calc(10px + var(--sl));display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:600;white-space:nowrap;border:1px solid transparent;box-shadow:var(--shadow);background:var(--sheet)}
.status.bad{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.status.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.status svg.i{width:16px;height:16px}

main{flex:1;min-height:0;display:flex}
.plan{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#plan{position:absolute;inset:0;width:100%;height:100%;display:block}
.fab{position:absolute;z-index:6;top:calc(10px + var(--st));right:calc(10px + var(--sr));width:40px;height:40px;border-radius:12px;background:var(--sheet);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink2)}
.fab:hover{color:var(--accent)}
.ctl{position:absolute;z-index:6;right:calc(10px + var(--sr));bottom:calc(10px + var(--sb));display:flex;flex-direction:column;gap:8px}
.ctl button{width:46px;height:46px;border-radius:14px;background:var(--sheet);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink2)}
.ctl button:hover{color:var(--accent)}
.ctl button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.ctl button.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.ctl button.primary[aria-pressed="true"]{opacity:.85;color:var(--sheet)}
.tip{position:absolute;z-index:5;left:calc(10px + var(--sl));bottom:calc(10px + var(--sb));right:70px;font-size:.76rem;color:var(--muted);pointer-events:none}
.tip span{background:color-mix(in srgb,var(--sheet) 85%,transparent);border-radius:6px;padding:4px 8px;display:inline-block}

/* popup */
.pop{position:absolute;z-index:10;background:var(--sheet);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px 6px 6px;min-width:220px;max-width:calc(100% - 16px);touch-action:manipulation}
.pop-h{display:flex;align-items:baseline;gap:8px;padding:0 8px 6px;font-size:.82rem}
.pop-h b{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop-h span{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);white-space:nowrap}
.pop-issue{margin:0 6px 6px;font-size:.76rem;font-weight:500;border-radius:8px;padding:5px 8px;line-height:1.35}
.pop-issue.bad{color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent)}
.pop-issue.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.pop-row{display:flex;gap:2px}
.pop-row button{flex:1;min-width:44px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px 6px;border-radius:9px;font-size:.66rem;color:var(--ink2)}
.pop-row button:hover{background:var(--accent-soft);color:var(--accent)}
.pop-row button:active{background:var(--accent-soft)}
.pop-row button.del{color:var(--danger)}
.pop-row button.del:hover{background:color-mix(in srgb,var(--danger) 10%,transparent)}
.pop-row button.del.armed{background:var(--danger);color:#fff}
.pop-row button.done{color:var(--accent)}

/* side / sheets */
/* panels float over the plan only while open: a side card on desktop, a bottom sheet on phones */
aside{position:fixed;z-index:20;display:none;background:var(--sheet);border:1px solid var(--line);box-shadow:var(--shadow);overflow:auto;overscroll-behavior:contain;
  top:12px;right:68px;width:340px;max-height:calc(100dvh - 24px);border-radius:16px}
aside.show{display:block}
.sheet{display:none;padding:16px}
.sheet.open{display:block}
.sh-h{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.sh-h h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0;font-weight:600}
.sh-h .x{display:grid;width:32px;height:32px;border-radius:8px;place-items:center;color:var(--muted)}
.grp{margin-bottom:12px}.grp:last-child{margin-bottom:0}
.grp-t{font-size:.74rem;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.82rem;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 10px;display:inline-flex;gap:6px;align-items:baseline}
.chip small{font-family:var(--f-mono);color:var(--muted);font-size:.68rem}
.chip:hover{border-color:var(--accent);background:var(--accent-soft)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.74rem;color:var(--muted)}
label.f.wide{grid-column:1/-1}
input[type=number],input[type=text]{font-family:var(--f-mono);font-size:.88rem;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.issues{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.issues li{font-size:.8rem;border-radius:8px;padding:6px 10px}
.issues li.bad{color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent)}
.issues li.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.toggles{display:flex;flex-direction:column;gap:8px;margin-top:14px;font-size:.86rem}
.toggles label{display:flex;gap:10px;align-items:center}
.toggles input{width:18px;height:18px;accent-color:var(--accent)}
.statline{font-size:.78rem;color:var(--muted);margin-top:14px;font-family:var(--f-mono)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{font-size:.82rem;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 12px}
.btn:hover{border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.armed,.chip.armed{background:var(--danger);border-color:var(--danger);color:#fff}

.lays{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.lay{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px;text-align:left}
.lay:hover{border-color:var(--accent)}
.lay svg{width:100%;height:auto;display:block}
.lay svg .t-room{fill:var(--floor);stroke:var(--wall);stroke-width:2}
.lay svg .t-it{fill:var(--wood);stroke:var(--ink2);stroke-width:1}
.lay svg .t-bed{fill:var(--fabric)}
.lay svg .t-door{fill:none;stroke:var(--ink2);stroke-width:1;stroke-dasharray:4 3}
.lay b{font-size:.86rem;font-weight:600;display:block}
.lay small{font-size:.72rem;color:var(--muted);font-family:var(--f-mono)}
.lay.armed{border-color:var(--accent);background:var(--accent-soft)}
.lay.armed small{color:var(--accent);font-family:var(--f-ui);font-weight:600}
.note{font-size:.76rem;color:var(--muted);margin:12px 0 0;line-height:1.45}
.lay-w{position:relative;display:flex}
.lay-w .lay{flex:1}
.lay-x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--sheet);border:1px solid var(--line);color:var(--muted)}
.lay-x svg.i{width:14px;height:14px}
.lay-x.armed{background:var(--danger);border-color:var(--danger);color:#fff;width:auto;padding:0 8px;font-size:.72rem;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:6px}
.btn svg.i{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--sheet);font-size:.82rem;font-weight:500;padding:9px 14px;border-radius:10px;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.toast.bad{background:var(--danger);color:#fff}


/* svg */
.room{fill:var(--floor)}
.wall{fill:none;stroke:var(--wall);stroke-linejoin:miter}
.dim{stroke:var(--muted);fill:none;opacity:.7}
.dimbg{fill:var(--paper)}
.dimt{fill:var(--muted);font-family:var(--f-mono)}
.it{cursor:grab}
.it:active{cursor:grabbing}
.hit{fill:transparent}
.base{stroke:var(--ink2)}
.dec{fill:none;stroke:var(--ink2);opacity:.55}
.decf{stroke:var(--ink2);stroke-opacity:.55}
.c-bed{fill:var(--fabric)} .c-bed2{fill:var(--fabric2)}
.c-wood{fill:var(--wood)} .c-desk{fill:var(--desk)} .c-soft{fill:var(--soft)} .c-stone{fill:var(--stone)}
.c-rug{fill:var(--accent-soft);stroke:var(--accent);opacity:.75}
.door-arc{fill:none;stroke:var(--ink2)}
.door-leaf{stroke:var(--ink)}
.c-window{fill:var(--accent-soft);stroke:var(--accent)}
.lbl{fill:var(--ink);font-family:var(--f-ui);font-weight:600;pointer-events:none}
.lbl2{fill:var(--muted);font-family:var(--f-mono);pointer-events:none}
.it.bad .base{stroke:var(--danger)}
.it.warn .base{stroke:var(--warn)}
.door-box{fill:transparent;stroke:transparent}
.it.warn .base.door-box{stroke:var(--warn)}
.sel{fill:none;stroke:var(--accent);pointer-events:none}
.clr{stroke:var(--accent);pointer-events:none}
.guide{stroke:var(--accent);opacity:.8;pointer-events:none}
.tag{pointer-events:none}
.tag text{font-family:var(--f-mono);font-weight:500}
.tag.blue rect{fill:var(--sheet);stroke:var(--accent)} .tag.blue text{fill:var(--accent)}
.tag.red rect{fill:var(--danger)} .tag.red text{fill:#fff}
.tag.amber rect{fill:var(--warn)} .tag.amber text{fill:#fff}
.ovl{fill:none;stroke:var(--danger);pointer-events:none}
.ovl.amber{stroke:var(--warn)}

@media (max-width:860px){
  aside{top:auto;left:0;right:0;bottom:0;width:auto;max-height:62dvh;border-bottom:0;border-radius:16px 16px 0 0}
  .sheet{padding:14px max(16px,var(--sr)) calc(18px + var(--sb)) max(16px,var(--sl))}
  input[type=number],input[type=text]{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style id="dyn"></style>
</head>
<body>

<main>
  <div class="plan" id="planWrap">
    <svg id="plan" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bedroom floor plan, top view"></svg>
    <button class="status" id="status" title="Show problems one by one" hidden></button>
    <div class="ctl">
      <button class="primary" data-sheet="Add" aria-pressed="false" aria-label="Add furniture" title="Add furniture"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button data-sheet="Layouts" aria-pressed="false" aria-label="Layouts" title="Layouts"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
      <button data-sheet="Room" aria-pressed="false" aria-label="Room size and settings" title="Room size and settings"><svg class="i" viewBox="0 0 24 24"><path d="M3 3h12v6h6v12H3z"/></svg></button>
    </div>
    <button class="fab" id="fit" title="Reset zoom" aria-label="Reset zoom" hidden>
      <svg class="i" viewBox="0 0 24 24"><path d="M3 9V4a1 1 0 0 1 1-1h5M15 3h5a1 1 0 0 1 1 1v5M21 15v5a1 1 0 0 1-1 1h-5M9 21H4a1 1 0 0 1-1-1v-5"/></svg>
    </button>
    <div class="tip" id="tip"><span id="tipText"></span></div>
    <div class="toast" id="toast" role="status" hidden></div>

    <div class="pop" id="pop" hidden>
      <div class="pop-h"><b id="popName"></b><span id="popSize"></span></div>
      <div class="pop-issue" id="popIssue" hidden></div>
      <div class="pop-row" id="popMain">
        <button data-a="rotL" aria-label="Rotate left"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>Left</button>
        <button data-a="rotR" aria-label="Rotate right"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>Right</button>
        <button data-a="nudge" aria-label="Nudge"><svg class="i" viewBox="0 0 24 24"><path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/></svg>Nudge</button>
        <button data-a="edit" aria-label="Edit size"><svg class="i" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Edit</button>
        <button data-a="dup" aria-label="Copy"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>Copy</button>
        <button data-a="del" class="del" aria-label="Delete"><svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg><span>Delete</span></button>
      </div>
      <div class="pop-row" id="popNudge" hidden>
        <button data-n="-1,0" aria-label="Move left 1 cm"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>1 cm</button>
        <button data-n="0,-1" aria-label="Move up 1 cm"><svg class="i" viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg>1 cm</button>
        <button data-n="0,1" aria-label="Move down 1 cm"><svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>1 cm</button>
        <button data-n="1,0" aria-label="Move right 1 cm"><svg class="i" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>1 cm</button>
        <button data-a="done" class="done" aria-label="Done"><svg class="i" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>Done</button>
      </div>
    </div>
  </div>

  <aside id="side">
    <section class="sheet" id="shEdit" hidden>
      <div class="sh-h"><h2 id="eTitle">Selected piece</h2><button class="x" data-close aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
      <div class="fields">
        <label class="f wide">Name<input type="text" id="pName" autocomplete="off"></label>
        <label class="f"><span id="lW">Width (cm)</span><input type="number" id="pW" min="5" inputmode="decimal"></label>
        <label class="f" id="fH"><span id="lH">Depth (cm)</span><input type="number" id="pH" min="5" inputmode="decimal"></label>
        <label class="f">From left wall<input type="number" id="pX" inputmode="decimal"></label>
        <label class="f">From top wall<input type="number" id="pY" inputmode="decimal"></label>
      </div>
      <ul class="issues" id="eIssues"></ul>
    </section>

    <section class="sheet" id="shLayouts">
      <div class="sh-h"><h2>Layouts</h2><button class="x" data-close aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
      <div class="lays" id="layouts"></div>
      <div class="row">
        <button class="btn primary" id="bShare"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>Share layout</button>
        <button class="btn" id="bOpen"><svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>Open layout file</button>
        <input type="file" id="fOpen" accept=".json,application/json" hidden>
      </div>
      <p class="note">Share saves what's on the plan now as a file you can send. Opening a file adds it here as a layout. Loading a layout replaces what's on the plan.</p>
    </section>

    <section class="sheet" id="shAdd">
      <div class="sh-h"><h2>Add furniture</h2><button class="x" data-close aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
      <div id="palette"></div>
    </section>

    <section class="sheet" id="shRoom">
      <div class="sh-h"><h2>Room (cm)</h2><button class="x" data-close aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
      <div class="fields">
        <label class="f">Length<input type="number" id="rLen" min="100" max="2000" inputmode="decimal"></label>
        <label class="f">Width at top<input type="number" id="rTop" min="100" max="2000" inputmode="decimal"></label>
        <label class="f">Extra width (step)<input type="number" id="rExtra" min="0" max="500" inputmode="decimal"></label>
        <label class="f">Step from top wall<input type="number" id="rNotch" min="0" max="2000" inputmode="decimal"></label>
      </div>
      <div class="toggles">
        <label><input type="checkbox" id="tSnap"> Snap to 5 cm while dragging</label>
        <label><input type="checkbox" id="tClr"> Show gaps to walls</label>
        <label><input type="checkbox" id="tLight"> Light mode</label>
      </div>
      <div class="statline" id="statline"></div>
      <div class="row">
        <button class="btn danger" id="bClear">Clear all furniture</button>
      </div>
    </section>
  </aside>
</main>


<script>
/* ---------- data ---------- */
const PRESETS=[
 {g:'Beds',items:[
  {type:'bed',name:'Single bed',w:90,h:190},
  {type:'bed',name:'Double bed',w:137,h:190},
  {type:'bed',name:'Queen bed',w:152,h:198},
  {type:'bed',name:'King bed',w:183,h:198}]},
 {g:'Storage',items:[
  {type:'wardrobe',name:'2-door wardrobe',w:90,h:60},
  {type:'wardrobe',name:'3-door wardrobe',w:135,h:60},
  {type:'wardrobe',name:'4-door wardrobe',w:180,h:60},
  {type:'sliding',name:'Sliding wardrobe',w:200,h:65},
  {type:'dresser',name:'Dresser',w:100,h:45},
  {type:'shelf',name:'Bookshelf',w:80,h:30},
  {type:'shelf',name:'Shoe rack',w:75,h:35}]},

function rightLimit(i){return i.y<R().notch?R().wTop:W()}

function inside(i){
  const x=i.x,y=i.y,a=ew(i),b=eh(i);
  if(x<-.01||y<-.01||y+b>R().len+.01||x+a>W()+.01)return false;

// how far a piece sticks through a wall, and where to put the label
function pastWall(i){
  if(inside(i))return null;
  const a=ew(i),b=eh(i),{len,wTop,notch}=R(),Wd=W(),cx=i.x+a/2,cy=i.y+b/2;
  const c=[[-i.x,i.x/2,cy],[-i.y,cx,i.y/2],[i.x+a-Wd,(Wd+i.x+a)/2,cy],[i.y+b-len,cx,(len+i.y+b)/2]];
  if(i.x+a>wTop&&i.y<notch)c.push([Math.min(i.x+a-wTop,notch-i.y),(Math.max(i.x,wTop)+i.x+a)/2,(i.y+Math.min(notch,i.y+b))/2]);
  const m=c.reduce((p,q)=>q[0]>p[0]?q:p);

}
function inter(a,b){

function doorBlock(d,i){

  const px=d.x+ew(d)/2+hx*Math.cos(t)-hy*Math.sin(t), py=d.y+eh(d)/2+hx*Math.sin(t)+hy*Math.cos(t);
  const qx=Math.min(Math.max(px,r.x),r.x+r.w), qy=Math.min(Math.max(py,r.y),r.y+r.h);

function computeIssues(){
  const by=new Map(),regs=[];let n=0;
  const add=(id,k,t)=>{if(!by.has(id))by.set(id,[]);by.get(id).push({k,t})};
  const solid=S.items.filter(i=>!PASSIVE.has(i.type));
  for(const i of S.items){
    if(OPENING.has(i.type))continue;
    const pw=pastWall(i);
    if(pw){n++;add(i.id,'bad',`Goes ${pw.p} cm past the wall`);regs.push({k:'wall',i,...pw})}
  }
  for(let a=0;a<solid.length;a++)for(let b=a+1;b<solid.length;b++){
    const r=inter(solid[a],solid[b]);if(!r)continue;
    n++;const amt=cm(Math.min(r.w,r.h));
    add(solid[a].id,'bad',`Overlaps ${solid[b].name} by ${amt} cm`);
    add(solid[b].id,'bad',`Overlaps ${solid[a].name} by ${amt} cm`);
    regs.push({k:'ov',...r,amt});
  }
  for(const d of S.items.filter(i=>i.type==='door'))for(const i of solid){
    const r=doorBlock(d,i);if(!r)continue;
    n++;add(i.id,'warn','Blocks the door swing');add(d.id,'warn',`${i.name} is in the door swing`);
    regs.push({k:'door',...r});

  const b=bounds(),vw=V.cw/V.k,vh=V.ch/V.k;
  V.ox=Math.min(b.x+b.w-vw*.25,Math.max(b.x-vw*.75,V.ox));

  if(a>vw*.8||b>vh*.8){fitView();return}

function deco(i){
  const w=i.w,h=i.h,x0=-w/2,y0=-h/2;
  let s='';
  const base=(cls,rx=2)=>`<rect class="base ${cls}" x="${x0}" y="${y0}" width="${w}" height="${h}" rx="${rx}"/>`;
  switch(i.type){
   case 'bed':{
    s+=base('c-bed',3);
    s+=`<rect class="decf c-wood" x="${x0}" y="${y0}" width="${w}" height="7" rx="2"/>`;
    const n=w>=120?2:1,pw=(w-14-(n-1)*6)/n;
    for(let k=0;k<n;k++)s+=`<rect class="decf c-bed2" x="${x0+7+k*(pw+6)}" y="${y0+12}" width="${pw}" height="24" rx="6"/>`;
    s+=`<rect class="decf c-bed2" x="${x0+2}" y="${y0+46}" width="${w-4}" height="${h-48}" rx="3"/>`;break;}
   case 'wardrobe':{
    s+=base('c-wood');const n=Math.max(1,Math.round(w/45));
    for(let k=1;k<n;k++)s+=`<line class="dec" x1="${x0+k*w/n}" y1="${y0}" x2="${x0+k*w/n}" y2="${y0+h}"/>`;
    s+=`<line class="dec" x1="${x0}" y1="${y0+h-3}" x2="${x0+w}" y2="${y0+h-3}"/>`;break;}
   case 'sliding':
    s+=base('c-wood');
    s+=`<line class="dec" x1="${x0}" y1="${y0+h-4}" x2="${x0+w*.55}" y2="${y0+h-4}"/><line class="dec" x1="${x0+w*.45}" y1="${y0+h-8}" x2="${x0+w}" y2="${y0+h-8}"/>`;break;
   case 'dresser':
    s+=base('c-wood');s+=`<rect class="decf c-bed2" x="${x0+w*.2}" y="${y0}" width="${w*.6}" height="4"/>`;break;
   case 'shelf':{
    s+=base('c-wood');const n=Math.max(1,Math.round(w/30));
    for(let k=1;k<n;k++)s+=`<line class="dec" x1="${x0+k*w/n}" y1="${y0}" x2="${x0+k*w/n}" y2="${y0+h}"/>`;break;}
   case 'side':
    s+=base('c-wood');s+=`<circle class="decf c-bed2" cx="0" cy="0" r="${Math.min(w,h)*.25}"/>`;break;
   case 'desk':
    s+=base('c-desk');break;
   case 'chair':
    s+=base('c-soft',8);s+=`<rect class="decf c-wood" x="${x0+4}" y="${y0}" width="${w-8}" height="9" rx="3"/>`;break;
   case 'tv':
    s+=base('c-wood');s+=`<rect fill="var(--ink2)" x="${x0+w*.15}" y="${y0+3}" width="${w*.7}" height="3" rx="1"/>`;break;
   case 'armchair': case 'sofa':
    s+=base('c-soft',6);
    s+=`<rect class="decf c-bed2" x="${x0+3}" y="${y0+3}" width="${w-6}" height="15" rx="4"/>`;
    s+=`<rect class="decf c-bed2" x="${x0+3}" y="${y0+3}" width="13" height="${h-6}" rx="4"/><rect class="decf c-bed2" x="${x0+w-16}" y="${y0+3}" width="13" height="${h-6}" rx="4"/>`;
    if(i.type==='sofa')s+=`<line class="dec" x1="0" y1="${y0+18}" x2="0" y2="${y0+h-3}"/>`;break;
   case 'door':
    s+=`<rect class="base door-box" x="${x0}" y="${y0}" width="${w}" height="${h}"/>`;
    s+=`<line x1="${x0}" y1="${y0}" x2="${x0+w}" y2="${y0}" stroke="var(--floor)" stroke-width="${4/V.k}"/>`;
    s+=`<path class="door-arc" d="M ${x0+w} ${y0} A ${w} ${w} 0 0 1 ${x0} ${y0+w}"/>`;
    s+=`<line class="door-leaf" x1="${x0}" y1="${y0}" x2="${x0}" y2="${y0+w}"/>`;break;
   case 'window':
    s+=`<rect class="base c-window" x="${x0}" y="${y0}" width="${w}" height="${h}"/><line class="dec" x1="${x0}" y1="0" x2="${x0+w}" y2="0"/>`;break;
   case 'rug':
    s+=`<rect class="base c-rug" x="${x0}" y="${y0}" width="${w}" height="${h}" rx="3"/>`;break;
   default: s+=base('c-stone');
  }
  return s;
}
function tag(x,y,txt,cls,u){

  y=Math.min(Math.max(y,V.oy+h/2+m),V.oy+V.ch*u-h/2-m);
  return `<g class="tag ${cls}"><rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="${h/2}"/><text x="${x}" y="${y+3.7*u}" text-anchor="middle">${esc(txt)}</text></g>`;
}

function clearance(i,u){
  const a=ew(i),b=eh(i),cx=i.x+a/2,cy=i.y+b/2;let s='',t='';

  if(Rg>.5){const yy=i.y<R().notch?i.y+Math.min(b,R().notch-i.y)/2:cy;s+=`<line class="clr" x1="${i.x+a}" y1="${yy}" x2="${rl}" y2="${yy}"/>`;t+=tag(i.x+a+Rg/2,yy,Math.round(Rg),'blue',u)}

  const B=R().len-(i.y+b);if(B>.5){s+=`<line class="clr" x1="${cx}" y1="${i.y+b}" x2="${cx}" y2="${R().len}"/>`;t+=tag(cx,i.y+b+B/2,Math.round(B),'blue',u)}

function itemSvg(i,lv,u){

function render(){

  s+=`<polygon class="room" points="${pts}"/><rect x="0" y="0" width="${Wd}" height="${len}" fill="url(#g50)" clip-path="url(#rc)" pointer-events="none"/>`;

function place(n){
  const vw=V.cw/V.k,vh=V.ch/V.k,tx=V.ox+vw/2,ty=V.oy+vh/2;
  const solid=S.items.filter(i=>!PASSIVE.has(i.type));
  let best=null,bd=Infinity;
  if(!PASSIVE.has(n.type)){
    for(let y=0;y<=R().len;y+=5)for(let x=0;x<=W();x+=5){
      n.x=x;n.y=y;if(!inside(n)||solid.some(o=>overlaps(n,o)))continue;
      const d=Math.hypot(x+ew(n)/2-tx,y+eh(n)/2-ty);if(d<bd){bd=d;best=[x,y]}
    }
  }
  if(best){[n.x,n.y]=best;return}
  n.x=Math.round(Math.max(0,Math.min(W()-ew(n),tx-ew(n)/2)));
  n.y=Math.round(Math.max(0,Math.min(R().len-eh(n),ty-eh(n)/2)));
  if(n.x+ew(n)>R().wTop&&n.y<R().notch)n.y=R().notch;
}

// Accept only well-formed layouts; anything odd in a file is rejected rather than half-loaded.
function cleanLayout(d,fallbackName){
  if(!d||typeof d!=='object')return null;
  const n=(v,lo,hi)=>typeof v==='number'&&isFinite(v)&&v>=lo&&v<=hi;
  const r=d.room;
  if(!r||!n(r.len,50,5000)||!n(r.wTop,50,5000)||!n(r.extra,0,2000)||!n(r.notch,0,5000))return null;
  if(!Array.isArray(d.items)||d.items.length>300)return null;
  const items=[];
  for(const o of d.items){
    if(!o||!TYPES.has(o.type)||!n(o.w,1,2000)||!n(o.h,1,2000)||!n(o.x,-5000,5000)||!n(o.y,-5000,5000))return null;
    items.push({type:o.type,name:String(o.name||o.type).slice(0,60),w:o.w,h:o.h,x:o.x,y:o.y,rot:[0,90,180,270].includes(o.rot)?o.rot:0});
  }
  const name=String(d.name||fallbackName||'Shared layout').trim().slice(0,60)||'Shared layout';
  return {name,room:{len:r.len,wTop:r.wTop,extra:r.extra,notch:Math.min(r.notch,r.len)},items};
}

/* ---------- gestures: drag pieces, pan, pinch, wheel ---------- */
const P=new Map();let G=null;
// Snap a piece's edges (and so its corners) to walls, the step corner and nearby pieces.
// Returns guide lines to draw for whatever it snapped to.
function magnet(i){
  const M=Math.max(4,9/V.k),a=ew(i),b=eh(i),{len,wTop,notch}=R(),NEAR=40;
  const xs=[[0,null],[rightLimit(i)-a,null],[wTop,wTop],[wTop-a,wTop]];
  const ys=[[0,null],[len-b,null],[notch,notch],[notch-b,notch]];
  for(const o of S.items){
    if(o===i||o.type==='rug')continue;
    const x1=o.x,x2=o.x+ew(o),y1=o.y,y2=o.y+eh(o);
    // only pieces that are close on the other axis
    if(i.y<y2+NEAR&&i.y+b>y1-NEAR){xs.push([x2,x2],[x1-a,x1],[x1,x1],[x2-a,x2])}
    if(i.x<x2+NEAR&&i.x+a>x1-NEAR){ys.push([y2,y2],[y1-b,y1],[y1,y1],[y2-b,y2])}
  }
  const pick=(v,c)=>{let best=null,bd=M;for(const [p,g] of c){const d=Math.abs(v-p);if(d<bd){bd=d;best=[p,g]}}return best};
  const g={x:null,y:null};
  const px=pick(i.x,xs);if(px){i.x=px[0];g.x=px[1]}
  const py=pick(i.y,ys);if(py){i.y=py[0];g.y=py[1]}
  // stepping into the narrow top part can change the right-wall limit
  if(i.y<notch&&i.x+a>wTop&&Math.abs(i.x+a-wTop)<M){i.x=wTop-a}
  return g;
}
function pinchStart(){
  const [a,b]=[...P.values()],r=svg.getBoundingClientRect();
  const mx=(a.x+b.x)/2-r.left,my=(a.y+b.y)/2-r.top;
  G={type:'pinch',d0:Math.hypot(a.x-b.x,a.y-b.y)||1,k0:V.k,wx:V.ox+mx/V.k,wy:V.oy+my/V.k};
}
svg.addEventListener('pointerdown',e=>{

  if(phone.matches&&side.classList.contains('show')){closeSheets()}
  try{svg.setPointerCapture(e.pointerId)}catch(_){}
  P.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(P.size===2){
    if(G&&G.type==='drag'&&G.moved){G.i.x=G.x0;G.i.y=G.y0}
    pinchStart();render();return;
  }
  if(P.size>2)return;
  const g=e.target.closest('.it'),i=g&&byId(+g.dataset.id);
  if(i){
    const p=pt(e);select(i.id);
    G={type:'drag',i,dx:p.x-i.x,dy:p.y-i.y,sx:e.clientX,sy:e.clientY,x0:i.x,y0:i.y,moved:false};
    render();e.preventDefault();return;
  }
  G={type:'pan',sx:e.clientX,sy:e.clientY,ox0:V.ox,oy0:V.oy,moved:false};
});
svg.addEventListener('pointermove',e=>{
  if(!P.has(e.pointerId))return;
  P.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(!G)return;
  if(G.type==='pinch'){
    if(P.size<2)return;
    const [a,b]=[...P.values()],r=svg.getBoundingClientRect();
    const mx=(a.x+b.x)/2-r.left,my=(a.y+b.y)/2-r.top;
    V.k=clampK(G.k0*Math.hypot(a.x-b.x,a.y-b.y)/G.d0);
    V.ox=G.wx-mx/V.k;V.oy=G.wy-my/V.k;V.fit=false;clampView();render();return;
  }
  if(G.type==='none')return;
  if(!G.moved&&Math.hypot(e.clientX-G.sx,e.clientY-G.sy)<4)return;
  G.moved=true;
  if(G.type==='drag'){
    const p=pt(e),i=G.i,st=S.snap?5:1;
    i.x=Math.round((p.x-G.dx)/st)*st;i.y=Math.round((p.y-G.dy)/st)*st;G.guides=magnet(i);render();
  }else{
    V.ox=G.ox0-(e.clientX-G.sx)/V.k;V.oy=G.oy0-(e.clientY-G.sy)/V.k;V.fit=false;clampView();render();
  }
});
function up(e){
  if(!P.has(e.pointerId))return;
  P.delete(e.pointerId);
  if(!G)return;
  if(G.type==='pinch'||G.type==='none'){if(P.size===0){G=null;render()}else G={type:'none'};return}
  if(P.size>0)return;
  const g=G;G=null;
  if(g.type==='drag'){if(g.moved)save();render();syncEdit()}
  else{if(!g.moved&&sel!==null)select(null);render()}
}
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{
  e.preventDefault();const r=svg.getBoundingClientRect();
  zoomAt(e.clientX-r.left,e.clientY-r.top,V.k*Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)));render();
},{passive:false});
['gesturestart','gesturechange'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
$('fit').onclick=()=>{fitView();render()};

/* ---------- keyboard (desktop) ---------- */
document.addEventListener('keydown',e=>{
  if(e.target.matches('input'))return;
  const i=selItem(),k=e.key;
  if(k==='Escape'){if(side.classList.contains('show')){closeSheets();render()}else if(i){select(null);render()}return}
  if(!i)return;
  const d=e.shiftKey?10:1;
  if(k==='ArrowLeft')i.x-=d;else if(k==='ArrowRight')i.x+=d;else if(k==='ArrowUp')i.y-=d;else if(k==='ArrowDown')i.y+=d;
  else if(k==='r'||k==='R'){rotate(i,e.shiftKey?-1:1);e.preventDefault();return}
  else if(k==='Delete'||k==='Backspace'){del(i);e.preventDefault();return}
  else if((e.metaKey||e.ctrlKey)&&k==='d'){dup(i);e.preventDefault();return}
  else return;
  e.preventDefault();commit();
});

/* ---------- always run the newest version ----------
   GitHub Pages lets browsers reuse a cached copy for up to 10 minutes. On load (and when the
   tab comes back into view) fetch the page fresh; if its BUILD stamp differs, reload once with
   a cache-busting ?v= so the browser and CDN serve the new file. Change BUILD on every
   release (any new value works; a UTC timestamp is used). */
const BUILD='20261105163257';
async function checkForUpdate(){
  if(location.protocol==='file:')return;
  try{
    const r=await fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    // pattern is split so stamping BUILD with a search-and-replace never rewrites this line
    const m=(await r.text()).match(new RegExp('const BU'+"ILD='([^']*)'"));
    if(!m||m[1]===BUILD)return;
    const tried='room-planner-update-'+m[1];
    if(sessionStorage.getItem(tried))return; // reload at most once per new version
    sessionStorage.setItem(tried,'1');
    location.replace(location.pathname+'?v='+encodeURIComponent(m[1])+location.hash);
  }catch(_){}
}
if(/[?&]v=/.test(location.search))history.replaceState(null,'',location.pathname+location.hash);
checkForUpdate();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkForUpdate()});

/* ---------- start ---------- */
function setTip(){$('tipText').textContent=coarse.matches?'Tap a piece for options · drag to move · pinch to zoom':'Click a piece for options · drag to move · scroll to zoom · R rotate · arrows nudge'}
setTip();coarse.addEventListener?.('change',setTip);
try{if(localStorage.getItem(KEY+'-tip'))$('tip').hidden=true}catch(_){}
phone.addEventListener?.('change',()=>{closeSheets();render()});
new ResizeObserver(()=>{
  const was=V.fit,b=bounds();measure();
  const kf=calcFit();
  if(was)fitView();else{V.kFit=kf;V.k=clampK(V.k);clampView()}
  render();
}).observe(svg);
roomStats();syncEdit();
</script>
